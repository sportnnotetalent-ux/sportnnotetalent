# Nightly encrypted backup of the live database (free: GitHub Actions minutes
# + artifact storage on the private repo). The Supabase free plan keeps no
# downloadable backups. Runbook: docs/ops/backups.md.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     session-pooler connection string (postgresql://postgres.<ref>:<password>@<pooler host>:5432/postgres)
#   BACKUP_PASSPHRASE   long random passphrase; keep a copy OUTSIDE GitHub (password manager)
name: Database backup

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 India time
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Dump roles, schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then echo "::error::Add the SUPABASE_DB_URL secret — docs/ops/backups.md"; exit 1; fi
          mkdir -p out
          supabase db dump --db-url "$DB_URL" -f out/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f out/schema.sql
          supabase db dump --db-url "$DB_URL" -f out/data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
          # Never keep an empty or partial dump as "the backup".
          for f in roles schema data; do test -s "out/$f.sql" || { echo "::error::$f.sql is empty"; exit 1; }; done
          grep -Eq 'CREATE TABLE (IF NOT EXISTS )?"?public"?\."?players"?' out/schema.sql || { echo "::error::schema.sql has no players table"; exit 1; }
          grep -Eq 'COPY "?public"?\."?players"?' out/data.sql || { echo "::error::data.sql has no players rows"; exit 1; }
          {
            echo "taken_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=${GITHUB_SHA}"
            for f in roles schema data; do echo "$f.sql bytes=$(wc -c < "out/$f.sql") sha256=$(sha256sum "out/$f.sql" | cut -d' ' -f1)"; done
            echo "players_copy_lines=$(awk '/^COPY "?public"?\."?players"? /{on=1;next} on&&/^\\\.$/{on=0} on{n++} END{print n+0}' out/data.sql)"
          } > out/MANIFEST.txt
          cat out/MANIFEST.txt

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ ${#PASSPHRASE} -lt 20 ]; then echo "::error::Add BACKUP_PASSPHRASE (20+ characters) — docs/ops/backups.md"; exit 1; fi
          name="sportnnote-db-$(date -u +%Y%m%d-%H%M)"
          tar -czf "$name.tar.gz" -C out .
          # AES-256 with a PBKDF2 key: the Mac's built-in openssl decrypts it (docs/ops/backups.md).
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -salt -pass env:PASSPHRASE -in "$name.tar.gz" -out "$name.tar.gz.enc"
          # Prove it decrypts before keeping it.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass env:PASSPHRASE -in "$name.tar.gz.enc" | cmp - "$name.tar.gz"
          sha256sum "$name.tar.gz.enc"
          rm -rf out "$name.tar.gz"
          # Saturday UTC (Sunday morning in India): keep 90 days; other nights 35.
          if [ "$(date -u +%u)" = "6" ]; then days=90; else days=35; fi
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "DAYS=$days" >> "$GITHUB_ENV"
          ls -l "$name.tar.gz.enc"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.enc
          retention-days: ${{ env.DAYS }}
          compression-level: 0
          if-no-files-found: error
